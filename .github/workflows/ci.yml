name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - run: npm run lint

      # tsc, then vite, which also creates dist/ for the Rust build.
      - run: npm run build

      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - run: cargo clippy --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

  # Windows ships at release time too, so it runs the same checks as macOS. A job of its own keeps the
  # macOS check's name, in case a branch rule waits on it.
  check-windows:
    runs-on: windows-latest
    steps:
      # Keep files byte for byte as committed: git on Windows would otherwise check them out with CRLF line endings.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - run: npm run lint

      # tsc, then vite, which also creates dist/ for the Rust build.
      - run: npm run build

      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - run: cargo clippy --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
