name: Contributor licence cases

# Not for merge: runs the contributor licence step against invented descriptions on the runner it uses.
on:
  pull_request:

permissions:
  contents: read

jobs:
  cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: perl -v | head -2 && bash --version | head -1
      - run: bash .github/scripts/licence-gate-cases.sh .github/workflows/contributor-licence.yml
