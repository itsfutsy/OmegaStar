[package]
name = "omega-star"
version = "0.1.0"
description = "Omega Star: a company of Claude Code employees"
authors = ["Abram Industries Pty Ltd"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
# Distinct from the bin name so the two do not collide on Windows (rust-lang/cargo#8519).
name = "omega_star_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-autostart = "2.6.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
axum = "0.8.9"
croner = "4.0.0"
which = "8.0.6"
dirs = "7.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-notification = "2"
trash = "5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
junction = "2.1.0"
