[package]
name = "omega-star"
version = "0.6.5"
description = "OmegaStar: a company of Claude Code employees"
authors = ["Abram Industries Pty Ltd"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
# Distinct from the bin name so the two do not collide on Windows (rust-lang/cargo#8519).
name = "omega_star_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-autostart = "2.6.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
axum = "0.8.9"
croner = "4.0.0"
which = "8.0.6"
dirs = "7.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-notification = "2"
trash = "5"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri-plugin-updater = "2"
ring = "0.17"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
junction = "2.1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSException", "NSString"] }
